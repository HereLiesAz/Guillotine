[versions]
# NOTE: AGP / Kotlin / Compose / compileSdk / Gradle (wrapper) must stay mutually compatible.
# AGP 9.x requires Kotlin 2.1+ (it owns a built-in `kotlin` extension; older KGP collides with
# "Cannot add extension with name 'kotlin'"), so Kotlin is on latest stable. AGP is on 9.2.0
# (last stable before 9.2.1, which has had regressions) — Kotlin must move regardless of which
# 9.x AGP we land on.
# material3 must stay on the 1.5.0-alpha line: the Expressive components we use
# (MaterialExpressiveTheme, LoadingIndicator) are NOT public in stable 1.4.0 — verified by aar
# inspection (1.4.0 ships MaterialThemeKt but no LoadingIndicatorKt). The alpha pulls Compose
# 1.12.0-alpha03, which no stable Compose BOM provides, so we pin the Compose UI artifacts to
# composeUi explicitly instead of using a BOM. material-icons-extended is frozen at 1.7.8
# (deprecated upstream) and rides along fine on the newer Compose runtime.
agp = "9.3.1"
kotlin = "2.4.10"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeUi = "1.13.0-alpha01"
material3 = "1.5.0-alpha26"
iconsExtended = "1.7.8"
media3 = "1.11.0"
datastore = "1.2.1"
coroutines = "1.11.0"
serialization = "1.11.0"
navigation = "2.9.8"
security = "1.1.0"
coreSplashscreen = "1.2.0"
mlkitImageLabeling = "17.0.9"
mlkitFaceDetection = "16.1.7"
mlkitSelfieSegmentation = "16.0.0-beta6"
vosk = "0.3.75"
# Desktop/JVM Vosk (offline speech-to-text). SEPARATE from `vosk` above (which is vosk-ANDROID, an
# AAR). The plain `vosk` artifact bundles JNA-loaded native libs for linux-x86_64 / windows-x86_64 /
# macOS, extracted from the jar to a temp dir at runtime (same load model as onnxruntime-jvm). CAVEAT:
# confirm the Apple-Silicon (osx-arm64) native ships in this build — if absent, arm64 Macs would hit
# UnsatisfiedLinkError; linux-x86_64 (CI) and windows-x86_64 are covered.
voskJvm = "0.3.45"
mediapipeTasksGenai = "0.10.35"
# Pin EXACTLY to match tasks-genai (aligns MPImage/vision-modality + native libs). Do NOT use a dynamic
# version: tasks-vision's Maven metadata advertises the old 0.20230731 as <release>, and version
# comparison treats 0.20230731 > 0.10.35, so `0.10.+`/`+` would resolve back to the stale 2023 build.
mediapipeTasksVision = "1.0.0"
aznavrail = "11.8"
billing = "9.1.0"
nanohttpd = "2.3.1"
okhttp = "5.5.0"
tensorflowLite = "2.17.0"
sherpaOnnx = "v1.13.4"
onnxruntime = "1.29.0"
commonsCompress = "1.28.0"
junit = "4.13.2"
json = "20260814"
# Ed25519 that does not depend on the platform provider. See AzpCrypto: Android's default provider
# resolves the algorithm name and then fails the operation, which made every signed package look forged.
# Kept in step with the root build.gradle.kts resolutionStrategy force for the same coordinates — that
# block pins the version the whole graph gets, so a different number here would simply be overridden.
bouncycastle = "1.85.2"
composeMultiplatform = "1.11.1"
# Bytedeco tri-version pairing (JavaCV 1.5.13 → JavaCPP 1.5.13 → FFmpeg 8.0.1-1.5.13).
# All three must move in lockstep — mixing versions produces UnsatisfiedLinkError at runtime.
# The FFmpeg artifact version is <ffmpeg>-<javacpp>, so its JavaCPP suffix MUST equal `javacpp`
# below (JavaCV 1.5.13 bundles JavaCPP 1.5.13 with FFmpeg 8.0.1). Previously ffmpeg was on the
# 1.5.13 line while javacv/javacpp lagged at 1.5.11 — a latent UnsatisfiedLinkError. Desktop-only
# deps (Android uses Media3). See https://github.com/bytedeco/javacv/blob/master/CHANGELOG.md.
javacv = "1.5.14"
javacpp = "1.5.14"
ffmpeg = "8.0.1-1.5.13"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeUi" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "composeUi" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeUi" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeUi" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "iconsExtended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security" }
mlkit-image-labeling = { group = "com.google.mlkit", name = "image-labeling", version.ref = "mlkitImageLabeling" }
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkitFaceDetection" }
mlkit-segmentation-selfie = { group = "com.google.mlkit", name = "segmentation-selfie", version.ref = "mlkitSelfieSegmentation" }
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
# Desktop/JVM Vosk — bundles JNA-loaded natives (linux-x86_64 / windows-x86_64 / macOS). Pulls
# net.java.dev.jna transitively. See the Apple-Silicon caveat on the `voskJvm` version above.
vosk-jvm = { group = "com.alphacephei", name = "vosk", version.ref = "voskJvm" }
mediapipe-tasks-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipeTasksGenai" }
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipeTasksVision" }
# AzNavRail publishes several modules on JitPack. Use the MAIN Android library module — artifact
# `aznavrail` (the `:aznavrail` Android module) — NOT the Compose-Multiplatform variant
# (`aznavrail-cmp-android`) and NOT the root aggregate `com.github.HereLiesAz:AzNavRail`. The CMP
# variant and the root aggregate carry Gradle module metadata (.module) advertising Wasm/JS variants
# that Gradle then tries to pull into the Android build, failing resolution. The plain `aznavrail`
# module resolves cleanly via its Android Maven POM (same `com.hereliesaz.aznavrail` package/API).
# Do not "simplify" this to the `-cmp-android` artifact or the root coordinate.
aznavrail = { group = "com.github.HereLiesAz.AzNavRail", name = "aznavrail", version.ref = "aznavrail" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
json = { group = "org.json", name = "json", version.ref = "json" }
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflowLite" }
sherpa-onnx = { group = "com.github.k2-fsa", name = "sherpa-onnx", version.ref = "sherpaOnnx" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
# Desktop/JVM ORT. The plain `onnxruntime` artifact (unlike `-android`) bundles the win/linux/mac
# native libs, extracted to a temp dir via JNI at runtime — so it works on the JVM desktop build.
onnxruntime-jvm = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntime" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
javacv = { group = "org.bytedeco", name = "javacv", version.ref = "javacv" }
javacpp = { group = "org.bytedeco", name = "javacpp", version.ref = "javacpp" }
ffmpeg = { group = "org.bytedeco", name = "ffmpeg", version.ref = "ffmpeg" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
