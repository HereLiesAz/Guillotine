# JVM args for the Gradle daemon.
#
# Xmx4g: the release build's D8/R8 dexer OOMs at 2 GB on `:app:mergeExtDexRelease` when
# fanning in the Media3 + ML Kit + MediaPipe + Vosk classpath. GitHub's ubuntu-latest runner
# has 16 GB, so 4 GB is comfortable. MaxMetaspaceSize=1g keeps Kotlin/AGP compiler metaspace
# bounded so the daemon doesn't grow without limit across builds.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Use AndroidX.
android.useAndroidX=true

# Kotlin official code style.
kotlin.code.style=official

# AGP 9 enables built-in Kotlin by default, which forbids applying the
# org.jetbrains.kotlin.android plugin ("plugin is no longer required since AGP 9.0").
# Opt out so we keep the traditional KGP plugin model (Kotlin 2.4.0 + the Compose and
# serialization Kotlin plugins applied explicitly). Supported through AGP 9.x.
android.builtInKotlin=false
# AGP 9 also defaults android.newDsl=true, whose ApplicationExtension is not a BaseExtension
# and so is incompatible with the traditional kotlin.android plugin. Opt out of the new DSL
# too. Both flags are honored through AGP 9.x (removed in AGP 10).
android.newDsl=false

# Non-transitive R classes keep the R class small and builds faster.
android.nonTransitiveRClass=true

# Parallel and cached builds.
org.gradle.parallel=true
org.gradle.caching=true
