# JVM args for the Gradle daemon.
#
# Xmx4g: the release build's D8/R8 dexer OOMs at 2 GB on `:app:mergeExtDexRelease` when
# fanning in the Media3 + ML Kit + MediaPipe + Vosk classpath. GitHub's ubuntu-latest runner
# has 16 GB, so 4 GB is comfortable. MaxMetaspaceSize=1g keeps Kotlin/AGP compiler metaspace
# bounded so the daemon doesn't grow without limit across builds.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Use AndroidX.
android.useAndroidX=true

# Kotlin official code style.
kotlin.code.style=official


# Non-transitive R classes keep the R class small and builds faster.
android.nonTransitiveRClass=true

# Parallel and cached builds.
org.gradle.parallel=true
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
