name: Desktop Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - version.properties
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Compile desktop module
        run: |
          chmod +x gradlew
          ./gradlew :desktop:compileKotlin --build-cache

      - name: Package uber-jar
        run: ./gradlew :desktop:packageUberJarForCurrentOS --build-cache

      - name: Upload desktop jar
        uses: actions/upload-artifact@v7
        with:
          name: desktop-jar
          path: desktop/build/compose/jars/*.jar
