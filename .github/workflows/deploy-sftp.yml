name: Deploy over FTP

# Mirror the docs directory to your own host over SFTP (SSH file transfer).
# Runs on every push to main, and can be fired by hand from the Actions tab.
# Uses lftp's built-in SFTP implementation — not OpenSSH — because ProFTPD
# mod_sftp/0.9.9's password auth is incompatible with sshpass.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER      hostname, e.g. sftp.example.com.
#   FTP_USERNAME    login user.
#   FTP_PASSWORD    login password.
#
# Optional repository variables:
#   SFTP_PORT         defaults to 22.
#   FTP_SERVER_DIR    remote path to mirror the site into. Defaults to /guillotine.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: sftp-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source (main)
        uses: actions/checkout@v4

      - name: Deploy via lftp (SFTP)
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PORT: ${{ vars.SFTP_PORT || '22' }}
          REMOTE_DIR: ${{ vars.FTP_SERVER_DIR || '/guillotine' }}
        run: |
          set -e
          sudo apt-get install -y lftp

          USER_TRIMMED=$(printf '%s' "$USERNAME" | tr -d ' \t\r\n')
          PW_TRIMMED=$(printf '%s' "$PASSWORD" | tr -d '\r\n')
          echo "[diag] username length raw=$(printf '%s' "$USERNAME" | wc -c) trimmed=$(printf '%s' "$USER_TRIMMED" | wc -c)"
          echo "[diag] password length raw=$(printf '%s' "$PASSWORD" | wc -c) trimmed=$(printf '%s' "$PW_TRIMMED" | wc -c)"
          echo "[diag] host: $(printf '%s' "$HOST" | wc -c) chars, port: $PORT, target: $REMOTE_DIR"

          lftp -u "$USER_TRIMMED","$PW_TRIMMED" \
            -p "$PORT" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; mirror -R --verbose ./docs/ $REMOTE_DIR; quit" \
            sftp://"$HOST"
