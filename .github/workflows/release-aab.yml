# centralized-by: HereLiesAz/workflows
# central-source-path: .github/workflows/release-aab.yml
# central-source-sha256: 09adb91f6846d345ebb261ae428ad9412bfbfac6fe1d1192a726b84546b46928
# This file intentionally contains no repository secrets.
# central-run-tracker: HereLiesAz/workflows
name: Release AAB to Play
on:
  # Publish ONLY from main (plus manual dispatch). Publishing on every branch push staged whichever
  # branch built last as the Play draft and burned Google's daily edit-commit quota ("Daily save quota
  # exceeded"), so the newest AAB often never landed. Restricting to main means the staged draft is
  # always the latest merged build, and there are few enough commits that the quota holds.
  push:
    branches: [main]
    paths-ignore:
      - version.properties
  workflow_dispatch:
    inputs:
      publish:
        default: true
        description: "Push the AAB to Play (false = build only)"

# Serialize Play publishes across ALL refs: the Play API allows only one open Edit per app, so two
# release-aab runs publishing at once (e.g. a merge to main overlapping a branch push) collide with
# "A change was made to the application outside of this Edit". Queue them (don't cancel a publish
# mid-flight) so each completes before the next starts.
permissions:
  actions: read
  contents: read
  statuses: read
jobs:
  central-status:
    name: Track centralized run
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Mirror centralized workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: .github/workflows/release-aab.yml
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: "set -euo pipefail\ncreated_at=\"$(gh api \"repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\" --jq .created_at)\"\nthreshold=\"$(date -u -d \"$created_at - 5 seconds\" +%s)\"\nlast_state=\"\"\n\nfor attempt in $(seq 1 720); do\n  statuses=\"$(gh api \"repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA?per_page=100\")\"\n  row=\"$(jq -c     --arg context \"$STATUS_CONTEXT\"     --argjson threshold \"$threshold\"     '[.[] | select(.context == $context and ((.updated_at | fromdateiso8601) >= $threshold))][0] // empty'     <<<\"$statuses\")\"\n\n  if [[ -n \"$row\" ]]; then\n    state=\"$(jq -r '.state' <<<\"$row\")\"\n    target_url=\"$(jq -r '.target_url // empty' <<<\"$row\")\"\n    if [[ \"$state\" != \"$last_state\" ]]; then\n      echo \"Central workflow state: $state\"\n      [[ -z \"$target_url\" ]] || echo \"Central run: $target_url\"\n      last_state=\"$state\"\n    fi\n    case \"$state\" in\n      success)\n        exit 0\n        ;;\n      failure|error)\n        exit 1\n        ;;\n    esac\n  fi\n\n  sleep 15\ndone\n\necho \"::error::Timed out waiting for centralized workflow status $STATUS_CONTEXT on $TARGET_SHA\" >&2\nexit 1\n"
