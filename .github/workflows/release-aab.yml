name: Release AAB to Play

# Builds a signed Android App Bundle and (optionally) publishes it to Google Play.
#
# Required repository secrets:
#   Signing (same ones used by release-apk.yml):
#     KEYSTORE_PRIVATE   - PEM private key for the upload key
#     KEYSTORE_CHAIN     - PEM certificate chain for the upload key
#     KEYSTORE_PASSWORD  - keystore password
#     KEY_ALIAS          - key alias
#     KEY_PASSWORD       - key password
#   Play publishing:
#     PLAY_SERVICE_ACCOUNT_JSON - the full JSON of a Google Cloud service account that has been
#       granted release permissions in the Play Console (Users & permissions). See SETUP below.
#
# SETUP (one-time):
#   1. Play Console → create the app, then enroll in Play App Signing (default). Sign with the
#      upload key above; Google holds the app-signing key.
#   2. Google Cloud Console → create a service account, create a JSON key, paste the JSON into the
#      PLAY_SERVICE_ACCOUNT_JSON secret. In the Play Console, invite that service account and grant
#      it "Release to testing tracks" (and Production if you intend to publish there).
#   3. FIRST UPLOAD MUST BE MANUAL: Google's API cannot create the very first release for a new app.
#      Upload one AAB by hand in the Play Console once; after that this workflow can publish.
#   4. Create at least one release in each of the alpha (closed testing), beta (open testing), and
#      production tracks by hand — the Play API can only add releases to tracks that already exist.
#
# Publishing rollout: one AAB, one Play Edit, four tracks. `internal` goes live (status=completed);
# `alpha`/`beta`/`production` are staged as drafts, ready to promote by hand in the Play Console.
# Implemented in `.github/scripts/publish_play.py` because Play rejects re-uploading the same
# versionCode, so a single Edit is the only way to hand one bundle to multiple tracks.
#
# versionCode comes from version.properties, which the build auto-increments. CI commits that bump
# back after a successful publish (see the "Persist the version bump" step) so the next push starts
# from the just-published code and Play never sees a duplicate versionCode. The bump commit only
# touches version.properties, and the push trigger below ignores that path so it doesn't re-run.

on:
  push:
    paths-ignore:
      - version.properties
  workflow_dispatch:
    inputs:
      publish:
        default: true
        description: "Push the AAB to Play (false = build only)"

# Serialize Play publishes across ALL refs: the Play API allows only one open Edit per app, so two
# release-aab runs publishing at once (e.g. a merge to main overlapping a branch push) collide with
# "A change was made to the application outside of this Edit". Queue them (don't cancel a publish
# mid-flight) so each completes before the next starts.
concurrency:
  group: google-play-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the version-bump commit back
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate keystore from secrets
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_PRIVATE" > private_key.pem
          echo "$KEYSTORE_CHAIN" > certificate_chain.crt
          openssl pkcs12 -export -in certificate_chain.crt -inkey private_key.pem \
            -name "$KEY_ALIAS" -out keystore.p12 \
            -password pass:"$KEYSTORE_PASSWORD"
          keytool -importkeystore -srckeystore keystore.p12 -srcstoretype PKCS12 \
            -destkeystore app/keystore.jks -deststoretype JKS \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" -noprompt
          rm private_key.pem certificate_chain.crt keystore.p12

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # version.properties auto-increments inside the build — no version override is passed.
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Publish runs by default (including on push) so a build that doesn't actually push FAILS the job —
      # a green check means it reached Play. Skip only by explicitly dispatching with publish: false.
      #
      # One AAB, four tracks, one Edit: internal goes live (status=completed) so testers see it
      # immediately; alpha (closed testing), beta (open testing), and production are staged as
      # drafts, ready to promote by hand in the Play Console. `.github/scripts/publish_play.py`
      # opens a single Edit, uploads once, releases to all four tracks, and commits — because
      # Play rejects re-uploading the same versionCode, this is the only way to hand one bundle
      # to multiple tracks in one shot.
      - name: Set up Python
        if: ${{ inputs.publish != 'false' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Publish to Google Play (internal completed + alpha/beta/production drafts)
        if: ${{ inputs.publish != 'false' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -e
          python -m pip install --quiet google-api-python-client==2.147.0 google-auth==2.35.0
          # Keep the service-account JSON off disk except while the script needs it.
          SA_JSON="$(mktemp)"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$SA_JSON"
          trap 'rm -f "$SA_JSON"' EXIT
          AAB="$(ls app/build/outputs/bundle/release/*.aab | head -n1)"
          python .github/scripts/publish_play.py \
            --package com.hereliesaz.guillotine \
            --aab "$AAB" \
            --sa-json "$SA_JSON"

      # Persist the versionCode the build just published. The build auto-increments
      # version.properties on disk but CI would otherwise discard it, so every push
      # rebuilt the same code and Play rejected the duplicate. Committing it back means
      # the next push starts from the just-published code. The push ignores version.properties
      # (see `on.push.paths-ignore`), so this commit does not trigger another build.
      - name: Persist the version bump
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          if git diff --cached --quiet; then
            echo "version.properties unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "ci: persist auto-incremented versionCode [skip ci]"
          # Retry to absorb a race with a concurrent push to the same branch.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Persisted version bump."
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing and retrying…"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not persist the version bump; the next build may collide."
          exit 1
