# centralized-by: HereLiesAz/workflows
# central-source-path: .github/workflows/release-aab.yml
# central-source-sha256: 09adb91f6846d345ebb261ae428ad9412bfbfac6fe1d1192a726b84546b46928
# This file intentionally contains no repository secrets.
name: Release AAB to Play [central proxy]
on:
  # Publish ONLY from main (plus manual dispatch). Publishing on every branch push staged whichever
  # branch built last as the Play draft and burned Google's daily edit-commit quota ("Daily save quota
  # exceeded"), so the newest AAB often never landed. Restricting to main means the staged draft is
  # always the latest merged build, and there are few enough commits that the quota holds.
  push:
    branches: [main]
    paths-ignore:
      - version.properties
  workflow_dispatch:
    inputs:
      publish:
        default: true
        description: "Push the AAB to Play (false = build only)"

# Serialize Play publishes across ALL refs: the Play API allows only one open Edit per app, so two
# release-aab runs publishing at once (e.g. a merge to main overlapping a branch push) collide with
# "A change was made to the application outside of this Edit". Queue them (don't cancel a publish
# mid-flight) so each completes before the next starts.
permissions:
  contents: read
  id-token: write
jobs:
  central-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to HereLiesAz/workflows
        env:
          WORKFLOWS_GATEWAY_URL: ${{ vars.WORKFLOWS_GATEWAY_URL }}
          EVENT_JSON: ${{ toJSON(github.event) }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
          VARS_JSON: ${{ toJSON(vars) }}
          SOURCE_WORKFLOW_PATH: .github/workflows/release-aab.yml
          SOURCE_SHA256: 09adb91f6846d345ebb261ae428ad9412bfbfac6fe1d1192a726b84546b46928
        shell: bash
        run: "set -euo pipefail\n[[ -n \"${WORKFLOWS_GATEWAY_URL:-}\" ]] || { echo \"Repository variable WORKFLOWS_GATEWAY_URL is not configured.\" >&2; exit 1; }\noidc_response=\"$(curl --fail-with-body --silent --show-error -H \"Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}\" \"${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hereliesaz-workflows\")\"\noidc_token=\"$(jq -r '.value // empty' <<<\"$oidc_response\")\"\n[[ -n \"$oidc_token\" ]] || { echo \"GitHub did not issue an OIDC token.\" >&2; exit 1; }\necho \"::add-mask::$oidc_token\"\npayload=\"$(jq -n   --arg repository \"$GITHUB_REPOSITORY\" --arg repository_id \"$GITHUB_REPOSITORY_ID\"   --arg repository_owner \"$GITHUB_REPOSITORY_OWNER\" --arg repository_owner_id \"$GITHUB_REPOSITORY_OWNER_ID\"   --arg sha \"$GITHUB_SHA\" --arg ref \"$GITHUB_REF\" --arg ref_name \"$GITHUB_REF_NAME\" --arg ref_type \"$GITHUB_REF_TYPE\"   --arg head_ref \"$GITHUB_HEAD_REF\" --arg base_ref \"$GITHUB_BASE_REF\" --arg actor \"$GITHUB_ACTOR\" --arg actor_id \"$GITHUB_ACTOR_ID\"   --arg event_name \"$GITHUB_EVENT_NAME\" --arg run_id \"$GITHUB_RUN_ID\" --arg run_number \"$GITHUB_RUN_NUMBER\" --arg run_attempt \"$GITHUB_RUN_ATTEMPT\"   --arg workflow_ref \"$GITHUB_WORKFLOW_REF\" --arg workflow_name \"$GITHUB_WORKFLOW\" --arg source_workflow_path \"$SOURCE_WORKFLOW_PATH\"   --arg source_sha256 \"$SOURCE_SHA256\" --argjson event \"$EVENT_JSON\" --argjson inputs \"$INPUTS_JSON\" --argjson vars \"$VARS_JSON\"   '{repository:$repository,repository_id:$repository_id,repository_owner:$repository_owner,repository_owner_id:$repository_owner_id,sha:$sha,check_sha:($event.pull_request.head.sha // $sha),ref:$ref,ref_name:$ref_name,ref_type:$ref_type,head_ref:$head_ref,base_ref:$base_ref,actor:$actor,actor_id:$actor_id,event_name:$event_name,event:$event,inputs:$inputs,vars:$vars,run_id:$run_id,run_number:$run_number,run_attempt:$run_attempt,workflow_ref:$workflow_ref,workflow_name:$workflow_name,source_workflow_path:$source_workflow_path,source_sha256:$source_sha256}')\"\ncurl --fail-with-body --silent --show-error -X POST \"${WORKFLOWS_GATEWAY_URL%/}/dispatch\" -H \"Authorization: Bearer ${oidc_token}\" -H \"Content-Type: application/json\" --data-binary \"$payload\""
