name: Merged Build & Release

on:
  push:
    branches: [ "**" ]
    # version.properties is auto-incremented on disk by every Gradle build (see build.gradle.kts);
    # a commit touching only that file shouldn't trigger a full rebuild here.
    paths-ignore:
      - version.properties
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Concurrency: a newer push to the same ref cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: most jobs only build/test. The release job that tags + uploads a
# GitHub Release raises its own permission to `contents: write` (see its job-level `permissions`).
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            printf '%s' "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Run unit tests
        run: |
          chmod +x gradlew
          # The app has product flavors (github/play), so the variant-specific unit-test task is
          # testGithubDebugUnitTest; `test` still aggregates every module's unit tests.
          ./gradlew testGithubDebugUnitTest test --continue --build-cache

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  build-and-release:
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            printf '%s' "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Release signing: decode the base64 KEYSTORE_RAW secret and export the env names
      # app/build.gradle.kts reads (KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD).
      # Without the secrets (forks, PRs) the release build is unsigned and nothing is published —
      # we never ship a throwaway-key or unsigned APK, because a key change breaks self-update
      # (INSTALL_FAILED_UPDATE_INCOMPATIBLE) for everyone who installed an earlier build.
      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_RAW" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_RAW" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release keystore secrets not available — building unsigned; publishing will be skipped."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Gradle
        id: gradle-build
        run: |
          set -o pipefail
          # version.properties auto-increments inside the build — no version override is passed.
          # The direct-download (github) flavor, release variant, signed with the release key above.
          ./gradlew assembleGithubRelease --build-cache 2>&1 | tee build.log

      # ------------------------------------------------------------------
      # FAILURE HANDLING — main pushes only; one open issue per title (later failures comment on it).
      # No raw build log is posted (it can carry paths/env details and attacker-influenced text);
      # the issue links to the run instead.
      # ------------------------------------------------------------------
      - name: Report build failure
        if: failure() && steps.gradle-build.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const title = 'Build failure on main';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `The \`assembleGithubRelease\` build failed on \`main\` at ${context.sha}.\n\nRun log: ${runUrl}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'bug', per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['bug'] });
            }

      # ------------------------------------------------------------------
      # RELEASE STEPS (main pushes with signing secrets only)
      # ------------------------------------------------------------------
      - name: Prepare Release Variables
        # Only the default branch publishes the canonical latest release, and only when the APK was
        # signed with the real release key. Feature/PR branches still build + test above.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.keystore.outputs.signed == 'true'
        id: release_vars
        run: |
          # Read straight from version.properties — the Gradle build above computed Patch/Build at
          # configuration time and wrote them back to this file, which is what's baked into the APK.
          MAJOR=$(grep 'versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          MINOR=$(grep 'versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          PATCH=$(grep 'versionPatch=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          BUILD_NUMBER=$(grep 'versionBuild=' version.properties | cut -d'=' -f2 | tr -d '\r ')

          VERSION_NAME="$MAJOR.$MINOR.$PATCH.$BUILD_NUMBER"

          TAG_NAME="latest-debug-v${MAJOR}.${MINOR}"

          APP_NAME=$(grep 'rootProject.name' settings.gradle.kts | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          [ -n "$APP_NAME" ] || APP_NAME="App"

          # Locate built APK (github flavor → app/build/outputs/apk/github/release)
          APK_ORIGINAL=$(find app/build/outputs/apk/github/release -name "*.apk" ! -name "*unsigned*" | head -n 1)

          if [ -z "$APK_ORIGINAL" ]; then
             echo "Error: No signed APK found to release!"
             exit 1
          fi

          TARGET_NAME="${APP_NAME}-${VERSION_NAME}.apk"
          mv "$APK_ORIGINAL" "$TARGET_NAME"

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "APK_FILE=$TARGET_NAME" >> $GITHUB_ENV

      - name: Publish Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.keystore.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Force update tag to point to current commit. (The tag name is kept for existing
          # self-update clients that look for latest-debug-v*.)
          git tag -fa $TAG_NAME -m "Latest Build"
          git push origin $TAG_NAME --force

          # Idempotent create-or-update; always upload with --clobber so a re-run replaces the APK.
          if ! gh release create "$TAG_NAME" "$APK_FILE" --prerelease \
                 --title "Latest Build ($TAG_NAME)" \
                 --notes "Auto-build from commit $GITHUB_SHA" \
                 --target "$GITHUB_SHA" 2>/dev/null; then
             echo "Release exists — updating..."
             gh release edit "$TAG_NAME" --prerelease \
               --title "Latest Build ($TAG_NAME)" \
               --notes "Auto-build from commit $GITHUB_SHA" \
               --target "$GITHUB_SHA"
             gh release upload "$TAG_NAME" "$APK_FILE" --clobber
          fi
