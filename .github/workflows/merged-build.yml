name: Merged Build

# Build + test only. Releases are owned by android-github-release.yml (signing material is held
# centrally), so this workflow no longer tags or uploads anything.
on:
  # main only: a PR branch is covered by the pull_request event below, so pushing to it no longer
  # builds the same commit twice.
  push:
    branches: [ "main" ]
    # version.properties is auto-incremented on disk by every Gradle build (see build.gradle.kts);
    # a commit touching only that file shouldn't trigger a full rebuild here.
    paths-ignore:
      - version.properties
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Concurrency: a newer push to the same PR ref cancels the in-flight run; runs on main are never
# cancelled (each main commit gets a complete build/test result).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default. The build job raises `issues: write` only to file build failures.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true  # the bundled on-device .task model is stored in Git LFS

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            printf '%s' "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Run unit tests
        run: |
          chmod +x gradlew
          # The app has product flavors (github/play), so the variant-specific unit-test task is
          # testGithubDebugUnitTest; `test` still aggregates every module's unit tests.
          ./gradlew testGithubDebugUnitTest test --continue --build-cache

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true  # the bundled on-device .task model is stored in Git LFS

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            printf '%s' "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        id: gradle-build
        run: |
          set -o pipefail
          # version.properties auto-increments inside the build — no version override is passed.
          # The direct-download (github) flavor, release variant. Unsigned compile/packaging check
          # only; signed releases come from android-github-release.yml.
          ./gradlew assembleGithubRelease --build-cache 2>&1 | tee build.log

      # ------------------------------------------------------------------
      # FAILURE HANDLING — main pushes only; one open issue per title (later failures comment on it).
      # No raw build log is posted (it can carry paths/env details and attacker-influenced text);
      # the issue links to the run instead.
      # ------------------------------------------------------------------
      - name: Report build failure
        if: failure() && steps.gradle-build.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const title = 'Build failure on main';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `The \`assembleGithubRelease\` build failed on \`main\` at ${context.sha}.\n\nRun log: ${runUrl}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'bug', per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['bug'] });
            }
