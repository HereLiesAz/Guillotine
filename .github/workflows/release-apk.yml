name: Compile and Release APK

# Runs on every push to main (plus manual dispatch) so the self-updating github-flavor APK never
# sits stale behind main again — it used to be workflow_dispatch-only, so real fixes on main (e.g.
# the Aug 24 R8/protobuf keep-rule fix) could merge and never reach users until someone remembered
# to trigger this by hand. Mirrors release-aab.yml's push-to-main trigger.
on:
  push:
    branches: [main]
    paths-ignore:
      - version.properties
  workflow_dispatch:

# Serialize runs: each run force-moves the same "latest-release-vX.Y" tag and clobbers the same
# release assets, so two overlapping runs (e.g. two pushes landing close together) would race on
# the tag push and asset upload. Queue them rather than cancel-in-progress so every push's build
# still gets published, just in order.
concurrency:
  group: release-apk-publish
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Generate Keystore from Secrets
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Generating keystore from certificate chain and private key..."

          # Write the private key and certificate chain to temporary files
          echo "$KEYSTORE_PRIVATE" > private_key.pem
          echo "$KEYSTORE_CHAIN" > certificate_chain.crt

          # Create a PKCS12 file from the key and certificate chain
          openssl pkcs12 -export -in certificate_chain.crt -inkey private_key.pem \
            -name "$KEY_ALIAS" -out keystore.p12 \
            -password pass:"$KEYSTORE_PASSWORD"

          # Convert the PKCS12 file to a JKS keystore
          keytool -importkeystore -srckeystore keystore.p12 -srcstoretype PKCS12 \
            -destkeystore app/keystore.jks -deststoretype JKS \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" -noprompt

          echo "Keystore generated successfully at app/keystore.jks"

          # Clean up temporary files
          rm private_key.pem certificate_chain.crt keystore.p12

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # version.properties auto-increments inside the build — no version override is passed.
          # The GitHub-distributed APK is the `github` flavor: no ads, self-updates from Releases.
          ./gradlew assembleGithubRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Prepare Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read Patch/Build straight from version.properties — the Gradle build that just ran
          # (assembleGithubRelease, above) already computed them at configuration time and wrote
          # the result back to this exact file (see build.gradle.kts's versioning block), and that
          # write is what's actually baked into the APK's versionCode/versionName. This step used
          # to re-derive its own PATCH/BUILD_NUMBER independently via `git rev-list`/`git blame` —
          # a separate, stale approximation that ignored the file Gradle had just written and
          # didn't match it: BUILD_NUMBER was raw `git rev-list --count HEAD` (a small number),
          # while the real versionBuild is offset by a monotonic floor (205920500+) and
          # auto-incremented, so the GitHub Release's title/tag/filename showed a version like
          # "1.1.5.1502" for an APK whose actual embedded versionCode was ~205921443. Reading the
          # file directly guarantees the release name matches what's actually inside the APK.
          MAJOR=$(grep 'versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          MINOR=$(grep 'versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          PATCH=$(grep 'versionPatch=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          BUILD_NUMBER=$(grep 'versionBuild=' version.properties | cut -d'=' -f2 | tr -d '\r ')

          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}.${BUILD_NUMBER}"
          TAG_NAME="latest-release-v${MAJOR}.${MINOR}"

          # Locate built APK (github flavor → app/build/outputs/apk/github/release)
          APK_ORIGINAL=$(find app/build/outputs/apk/github/release -name "*.apk" | head -n 1)
          if [ -z "$APK_ORIGINAL" ]; then
            echo "Error: No APK found in app/build/outputs/apk/github/release/"
            find app/build/outputs/ -name "*.apk"
            exit 1
          fi

          APP_NAME=$(grep 'rootProject.name' settings.gradle.kts | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          [ -z "$APP_NAME" ] && APP_NAME="Guillotine"
          TARGET_NAME="${APP_NAME}-${VERSION_NAME}-release.apk"
          mv "$APK_ORIGINAL" "$TARGET_NAME"

          # R8's mapping.txt is the only way to deobfuscate a crash stack trace from this APK
          # (minifyEnabled/shrinkResources are on for release — see app/build.gradle.kts). Unlike
          # the play flavor's AAB (release-aab.yml), which Play Console deobfuscates automatically
          # from bundle metadata, this github-flavor APK has no such backend — so the mapping file
          # has to be captured here or a real-device crash like "fi3.a" is unreadable. Uploaded to
          # the same release tag as the APK (clobbered on every run, same as the APK itself) so the
          # mapping always matches whatever build is currently live for self-updating installs.
          MAPPING_ORIGINAL="app/build/outputs/mapping/githubRelease/mapping.txt"
          MAPPING_TARGET=""
          if [ -f "$MAPPING_ORIGINAL" ]; then
            MAPPING_TARGET="${APP_NAME}-${VERSION_NAME}-mapping.txt"
            cp "$MAPPING_ORIGINAL" "$MAPPING_TARGET"
          else
            echo "::warning::No mapping.txt found at $MAPPING_ORIGINAL — release APK crashes won't be deobfuscatable."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Force update tag to current commit
          git tag -fa "$TAG_NAME" -m "Latest Release Build"
          git push origin "$TAG_NAME" --force

          # Create or update release
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Updating existing release..."
            gh release edit "$TAG_NAME" \
              --title "Latest Release v${MAJOR}.${MINOR} (${VERSION_NAME})" \
              --notes "Release build from commit $GITHUB_SHA"
            gh release upload "$TAG_NAME" "$TARGET_NAME" --clobber
          else
            echo "Creating new release..."
            gh release create "$TAG_NAME" "$TARGET_NAME" \
              --title "Latest Release v${MAJOR}.${MINOR} (${VERSION_NAME})" \
              --notes "Release build from commit $GITHUB_SHA"
          fi

          if [ -n "$MAPPING_TARGET" ]; then
            gh release upload "$TAG_NAME" "$MAPPING_TARGET" --clobber
          fi
