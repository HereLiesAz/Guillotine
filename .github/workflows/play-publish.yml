name: Play Store Publish

# Triggers:
#   push to main  → upload signed AAB to the internal testing track
#   push of v* tag → promote (draft) to alpha and beta tracks
on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]
    paths-ignore:
      - version.properties

  workflow_dispatch:
    inputs:
      track:
        description: "Target track (internal / alpha / beta)"
        required: true
        default: internal
        type: choice
        options: [ internal, alpha, beta ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Decode keystore
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
        run: |
          echo "$KEYSTORE_RAW" | base64 -d > app/keystore.jks

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Build Play release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundlePlayRelease --build-cache

      - name: Locate AAB
        id: aab
        run: |
          AAB=$(find app/build/outputs/bundle/playRelease -name "*.aab" | head -n 1)
          if [ -z "$AAB" ]; then
            echo "Error: AAB not found"
            exit 1
          fi
          echo "path=$AAB" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------
      # Determine which tracks to publish to.
      #   main branch push  → internal only
      #   v* tag push       → internal + alpha (draft) + beta (draft)
      #   workflow_dispatch → whatever the caller chose
      # ----------------------------------------------------------------
      - name: Resolve target tracks
        id: tracks
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tracks=${{ github.event.inputs.track }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tracks=internal alpha beta" >> $GITHUB_OUTPUT
          else
            echo "tracks=internal" >> $GITHUB_OUTPUT
          fi

      # Internal — always published (not a draft so testers get it immediately)
      - name: Upload to internal testing
        if: contains(steps.tracks.outputs.tracks, 'internal')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hereliesaz.guillotine
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: internal
          status: completed

      # Alpha — draft so the release requires manual promotion in Play Console
      - name: Upload draft to alpha
        if: contains(steps.tracks.outputs.tracks, 'alpha')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hereliesaz.guillotine
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: alpha
          status: draft

      # Beta — draft for the same reason
      - name: Upload draft to beta
        if: contains(steps.tracks.outputs.tracks, 'beta')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hereliesaz.guillotine
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: beta
          status: draft
