name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you're trying to solve
      description: Describe the need, not just the solution — it helps find the best fit for the roadmap.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: How you imagine it working. Rough is fine.
    validations:
      required: false
  - type: checkboxes
    id: invariants
    attributes:
      label: On-device fit
      description: Guillotine keeps footage on-device. If this needs the cloud, note it below.
      options:
        - label: This can run on-device, or its cloud use is opt-in and exchanges only text (not media).
          required: false
