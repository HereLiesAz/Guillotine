name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. The more specific you are, the faster it gets fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Imported a 4K clip
        2. Tapped Export
        3. Expected an mp4; got a crash
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Desktop — Linux
        - Desktop — macOS
        - Desktop — Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: From the About screen (or the release/build you installed).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screen capture
      description: Any logcat output, a stack trace, or a short screen recording helps a lot.
    validations:
      required: false
